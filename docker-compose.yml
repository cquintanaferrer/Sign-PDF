services:

  # ==========================================================
  # POSTGRES
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: signpdf-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - signpdf


  # ==========================================================
  # CA SERVICE
  # ==========================================================

  ca-service:
    build:
      context: ./ca-service
      dockerfile: dockerfile

    container_name: signpdf-ca
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}

      CA_ADMIN_PASSWORD: ${CA_ADMIN_PASSWORD}
      AUTHORITY1_PASSWORD: ${AUTHORITY1_PASSWORD}
      AUTHORITY2_PASSWORD: ${AUTHORITY2_PASSWORD}
      AUTHORITY3_PASSWORD: ${AUTHORITY3_PASSWORD}
      AUTHORITY4_PASSWORD: ${AUTHORITY4_PASSWORD}

    depends_on:
      - postgres

    networks:
      - signpdf


  # ==========================================================
  # CA FRONTEND
  # ==========================================================

  ca-frontend:
    build:
      context: ./ca-frontend
      dockerfile: dockerfile

    container_name: signpdf-ca-frontend
    restart: unless-stopped

    depends_on:
      - ca-service

    networks:
      - signpdf


  # ==========================================================
  # SIGN PDF API
  # ==========================================================

  sign-pdf-api:
    build:
      context: ./sign-pdf-api
      dockerfile: Dockerfile

    container_name: signpdf-client-api
    restart: unless-stopped

    environment:
      CA_SERVICE_URL: http://ca-service:8000
      DATABASE_URL: sqlite:////app/data/sign_pdf.db

    volumes:
      - signpdf_client_data:/app/data

    depends_on:
      - ca-service

    networks:
      - signpdf


  # ==========================================================
  # SIGN PDF CLIENT
  # ==========================================================

  sign-pdf-client:
    build:
      context: ./sign-pdf-client
      dockerfile: Dockerfile

    container_name: signpdf-client
    restart: unless-stopped

    depends_on:
      - sign-pdf-api

    networks:
      - signpdf


  # ==========================================================
  # NGINX GENERAL
  # ==========================================================

  nginx:
    image: nginx:alpine
    container_name: signpdf-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - ca-service
      - ca-frontend
      - sign-pdf-api
      - sign-pdf-client

    networks:
      - signpdf


# ==========================================================
# VOLUMES
# ==========================================================

volumes:
  postgres_data:
  signpdf_client_data:


# ==========================================================
# NETWORK
# ==========================================================

networks:
  signpdf:
    driver: bridge