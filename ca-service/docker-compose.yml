services:
  postgres:
    image: postgres:17
    container_name: signpdf-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: signpdf
      POSTGRES_USER: signpdf
      POSTGRES_PASSWORD: signpdf_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: